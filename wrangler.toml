name = "time-blocked-todo"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# Cloudflare KV namespace bound as `env.RECORDS` inside Pages Functions.
# Create the namespace once with:
#   npx wrangler kv namespace create RECORDS
#   npx wrangler kv namespace create RECORDS --preview
# then paste the returned IDs below (or set them in the Pages dashboard
# under Settings -> Functions -> KV namespace bindings).
[[kv_namespaces]]
binding = "RECORDS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"
