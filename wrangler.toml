name = "time-blocked-todo"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# ──────────────────────────────────────────────────────────────────────────
# KV namespace `RECORDS`
#
# このリポジトリには `wrangler.toml` が含まれているため、Cloudflare Pages は
# 「wrangler.toml-managed bindings」モードで動作する。つまり本番バインディングは
# **このファイルが唯一の source of truth** であり、ダッシュボードの
# "KV namespace bindings" UI は read-only になる
# （"Bindings for this project are being managed through wrangler.toml" 表示）。
#
# 初回セットアップで必ず以下の手順を実施する:
#   1. ダッシュボード Workers & Pages → KV で `RECORDS` namespace を作る。
#   2. その namespace の "ID" カラム（32 文字の 16 進）をコピー。
#   3. 下の `id` と `preview_id` の `<...>` を実 ID に置換。
#      （preview_id は同じ ID でよい。preview deployment 用に分けたければ
#       別の namespace を作ってその ID を入れる。）
#   4. commit して push → Pages が再デプロイされ binding が効く。
#
# KV namespace ID は秘密情報ではない（リソース識別子であって認証情報ではない）。
# 公開リポジトリにコミットしても問題ない。
# ──────────────────────────────────────────────────────────────────────────

[[kv_namespaces]]
binding = "RECORDS"
id = "e1fdc3463b23487187bf38ab76b4a75c"
preview_id = "e1fdc3463b23487187bf38ab76b4a75c"
